{% extends 'base.html' %}
{% block header_title %}Schedule Mentorship Session{% endblock %}

{% block content %}
<style>
    .meeting-form-card {
        max-width: 680px; margin: 0 auto; background: white;
        padding: 40px; border-radius: 28px; border: 1px solid var(--line);
        box-shadow: 0 15px 35px rgba(0, 51, 102, 0.05);
    }
    .form-label { display: block; font-size: 12px; font-weight: 800; color: var(--navy); text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 8px; }
    .form-input { width: 100%; padding: 13px 16px; border: 1.5px solid var(--line); border-radius: 12px; font-size: 14px; font-family: inherit; background: #fdfdfd; margin-bottom: 20px; transition: 0.3s; }
    .form-input:focus { outline: none; border-color: var(--gold); background: white; box-shadow: 0 0 0 4px var(--gold-soft); }
    .btn-submit-meeting { background: var(--navy); color: white; padding: 15px; border-radius: 12px; font-size: 15px; font-weight: 700; border: none; cursor: pointer; transition: 0.3s; width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .btn-submit-meeting:hover { background: var(--gold); transform: translateY(-2px); }
</style>

<div class="meeting-form-card">
    <div style="text-align: center; margin-bottom: 30px;">
        <div style="width: 55px; height: 55px; border-radius: 18px; background: var(--navy); color: var(--gold); display: inline-flex; align-items: center; justify-content: center; font-size: 22px; margin-bottom: 12px;">
            <i class="fas fa-calendar-check"></i>
        </div>
        <h2 style="margin: 0; font-family: 'Lexend'; color: var(--navy);">Schedule Mentorship Meeting</h2>
        <p style="margin: 6px 0 0; color: #64748b; font-size: 14px;">Define session topic, schedule, and attach a meeting URL (Microsoft Teams, Zoom, or Google Meet).</p>
    </div>

    <form method="post">
        {% csrf_token %}
        <div>
            <label class="form-label">Meeting Topic / Title</label>
            <input type="text" name="title" class="form-input" placeholder="e.g. Sprint 2 Milestone Review & Code Walkthrough" required>
        </div>

        <div>
            <label class="form-label">Mentorship Pairing / Mentee</label>
            <select name="pairing_id" class="form-input" required>
                <option value="">-- Choose Assigned Pairing --</option>
                {% for p in pairings %}
                <option value="{{ p.id }}">{{ p.mentor.get_full_name|default:p.mentor.username }} ↔ {{ p.mentee.get_full_name|default:p.mentee.username }} ({{ p.group.name|default:"Individual" }})</option>
                {% endfor %}
            </select>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
            <div>
                <label class="form-label">Meeting Date</label>
                <input type="date" name="meeting_date" class="form-input" required>
            </div>
            <div>
                <label class="form-label">Meeting Time</label>
                <input type="time" name="meeting_time" class="form-input" required>
            </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1.5fr; gap: 15px;">
            <div>
                <label class="form-label">Meeting Platform</label>
                <select name="meeting_platform" class="form-input">
                    <option value="Microsoft Teams" selected>Microsoft Teams</option>
                    <option value="Zoom">Zoom</option>
                    <option value="Google Meet">Google Meet</option>
                    <option value="Other">Other Platform</option>
                </select>
            </div>
            <div>
                <label class="form-label">Meeting Link (URL)</label>
                <input type="url" name="meeting_link" class="form-input" placeholder="https://teams.microsoft.com/l/meetup-join/..." required>
            </div>
        </div>

        <div>
            <label class="form-label">Agenda & Instructions</label>
            <textarea name="agenda" rows="3" class="form-input" placeholder="Topics to cover, required pre-reading, deliverables to present..."></textarea>
        </div>

        <button type="submit" class="btn-submit-meeting">
            <i class="fas fa-paper-plane"></i> Confirm Session & Notify Participants
        </button>
    </form>
</div>
{% endblock %}
