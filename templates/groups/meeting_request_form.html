{% extends 'base.html' %}
{% block header_title %}Request Mentorship Session{% endblock %}

{% block content %}
<style>
    .request-form-card {
        max-width: 620px; margin: 0 auto; background: white;
        padding: 40px; border-radius: 28px; border: 1px solid var(--line);
        box-shadow: 0 15px 35px rgba(0, 51, 102, 0.05);
    }
    .form-label { display: block; font-size: 12px; font-weight: 800; color: var(--navy); text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 8px; }
    .form-input { width: 100%; padding: 13px 16px; border: 1.5px solid var(--line); border-radius: 12px; font-size: 14px; font-family: inherit; background: #fdfdfd; margin-bottom: 20px; transition: 0.3s; }
    .form-input:focus { outline: none; border-color: var(--gold); background: white; box-shadow: 0 0 0 4px var(--gold-soft); }
    .btn-submit-req { background: var(--gold); color: white; padding: 15px; border-radius: 12px; font-size: 15px; font-weight: 700; border: none; cursor: pointer; transition: 0.3s; width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .btn-submit-req:hover { background: #e68a00; transform: translateY(-2px); }
</style>

<div class="request-form-card">
    <div style="text-align: center; margin-bottom: 25px;">
        <div style="width: 55px; height: 55px; border-radius: 18px; background: var(--gold-soft); color: var(--gold); display: inline-flex; align-items: center; justify-content: center; font-size: 22px; margin-bottom: 12px;">
            <i class="fas fa-calendar-plus"></i>
        </div>
        <h2 style="margin: 0; font-family: 'Lexend'; color: var(--navy);">Request Mentorship Meeting</h2>
        <p style="margin: 6px 0 0; color: #64748b; font-size: 14px;">
            Submit a session request to your assigned mentor: <strong>{{ mentor.get_full_name|default:mentor.username }}</strong>
        </p>
    </div>

    <form method="post">
        {% csrf_token %}
        <div>
            <label class="form-label">Meeting Topic / Question</label>
            <input type="text" name="topic" class="form-input" placeholder="e.g. Research Methodology Review or Project Feedback" required>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
            <div>
                <label class="form-label">Proposed Date</label>
                <input type="date" name="proposed_date" class="form-input" required>
            </div>
            <div>
                <label class="form-label">Proposed Time</label>
                <input type="time" name="proposed_time" class="form-input" required>
            </div>
        </div>

        <div>
            <label class="form-label">Agenda / Specific Questions</label>
            <textarea name="agenda" rows="4" class="form-input" placeholder="Describe what you would like guidance on during this session..."></textarea>
        </div>

        <button type="submit" class="btn-submit-req">
            <i class="fas fa-paper-plane"></i> Submit Request to Mentor
        </button>
    </form>
</div>
{% endblock %}
